spring:
  application:
    name: adaptive-cache-router
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adaptive_cache}
    username: ${DB_USERNAME:adaptive}
    password: ${DB_PASSWORD:adaptive}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
